<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculator">
    <input type="text" id="display" placeholder="Enter expression">

    <div class="buttons">
        <button onclick="calc.clearDisplay()">C</button>
        <button onclick="calc.deleteLast()">⌫</button>
        <button onclick="calc.appendValue('(')">(</button>
        <button onclick="calc.appendValue(')')">)</button>

        <button onclick="calc.sin()">sin</button>
        <button onclick="calc.cos()">cos</button>
        <button onclick="calc.tan()">tan</button>
        <button onclick="calc.log()">log</button>

        <button onclick="calc.ln()">ln</button>
        <button onclick="calc.sqrt()">√</button>
        <button onclick="calc.square()">x²</button>
        <button onclick="calc.appendValue('**')">xʸ</button>

        <button onclick="calc.appendValue('7')">7</button>
        <button onclick="calc.appendValue('8')">8</button>
        <button onclick="calc.appendValue('9')">9</button>
        <button onclick="calc.appendValue('/')">/</button>

        <button onclick="calc.appendValue('4')">4</button>
        <button onclick="calc.appendValue('5')">5</button>
        <button onclick="calc.appendValue('6')">6</button>
        <button onclick="calc.appendValue('*')">*</button>

        <button onclick="calc.appendValue('1')">1</button>
        <button onclick="calc.appendValue('2')">2</button>
        <button onclick="calc.appendValue('3')">3</button>
        <button onclick="calc.appendValue('-')">-</button>

        <button onclick="calc.appendValue('0')">0</button>
        <button onclick="calc.appendValue('.')">.</button>
        <button onclick="calc.appendValue(Math.PI.toString())">π</button>
        <button onclick="calc.appendValue('+')">+</button>

        <button class="equal" onclick="calc.calculate()">=</button>
    </div>
</div>

<script src="calculator.js"></script>

</body>
</html>
