<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculation</title>
</head>

<body>

    <h2>Simple Calculation</h2>

    Number 1:
    <input id="userInput1" size="10"><br><br>

    Number 2:
    <input id="userInput2" size="10"><br><br>

    <button onclick="userSubmit()">Submit</button>

    <p>Result:</p>
    <div id="result"></div>

    <script>
        function userSubmit() {
            const UI1 = parseInt(document.getElementById("userInput1").value);
            const UI2 = parseInt(document.getElementById("userInput2").value);

            const UI3 = UI1 + UI2;
            const UI4 = UI1 - UI2;
            const UI5 = UI1 * UI2;
            const UI6 = UI1 / UI2;
            const UI7 = UI1 % UI2;
            document.getElementById("result").innerHTML = UI3;
        }
    </script>

</body>
</html>
